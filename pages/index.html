<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Already dark: stop Dark Reader re-theming it (it also breaks the highlight.js theme). -->
<meta name="darkreader-lock">
<title>Pairwise Sorter</title>
<meta name="description" content="Rank any list by answering &quot;which is better?&quot; one pair at a time.">
<meta property="og:type" content="website">
<meta property="og:title" content="Pairwise Sorter">
<meta property="og:description" content="Rank any list by answering &quot;which is better?&quot; one pair at a time.">
<meta property="og:url" content="https://rascaltwo.github.io/pairwise-sorter/">
<meta property="og:image" content="https://rascaltwo.github.io/pairwise-sorter/docs/og.auto.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  body { margin: 0; background: #0f1420; color: #e6eaf2; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1600px; margin: 0 auto; padding: 24px 32px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #8a95a8; font-size: 13px; margin: 0 0 16px; }
  a { color: #6aa8ff; }
  code { background: #171e2e; padding: 1px 5px; border-radius: 4px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .docs { font-size: 13px; padding: 5px 12px; border: 1px solid #2a3448; border-radius: 999px; text-decoration: none; white-space: nowrap; }
  .docs:hover { border-color: #6aa8ff; }
</style>
</head>
<body>
<main>
  <header><h1>Pairwise Sorter</h1><a class="docs" href="docs/">Documentation — how it works, and use it in your own page →</a></header>
  <p class="sub">You are the comparator — about n·log₂n choices instead of ranking the whole list in your head.</p>
  <!-- Discoverable by a human reading the page AND by an agent reading its text. -->
  <p class="sub">Driving this with an AI? Don't click through the UI — run <code>pairwiseSorter.help()</code> in the page console.</p>
  <pairwise-sorter storage-key="pairwise-sorter"></pairwise-sorter>
</main>
<script type="module">
  import { installConsole } from "./dist/element/index.js";
  installConsole(document.querySelector("pairwise-sorter"));
</script>
</body>
</html>
